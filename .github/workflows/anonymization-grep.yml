name: anonymization-grep
# Block PRs that introduce known leak patterns (live API keys, internal
# hostnames, etc.) into the public Efficient-Labs repository.
#
# Source list of patterns + allowlist lives at .github/scripts/anonymization-grep.sh.
# See ADR-0007 for the public/private split this gate enforces.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  anonymization-grep:
    name: scan for leak patterns
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" "$HEAD" | tr '\n' ' ')
          else
            # push to main — scan everything in the commit range
            FILES=$(git diff --name-only --diff-filter=ACMR "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null \
              | tr '\n' ' ' || true)
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed files: $FILES"

      - name: Run anonymization-grep
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          chmod +x .github/scripts/anonymization-grep.sh
          .github/scripts/anonymization-grep.sh
